<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Билет 1 — Огневая подготовка</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .quiz-container { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 550px; width: 100%; box-sizing: border-box; }
        .question { font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; color: #333; line-height: 1.4; }
        .quiz-image { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin-bottom: 15px; display: none; background: #fafafa; }
        
        .option-btn { display: block; width: 100%; background: #f0f0f0; border: 2px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 8px; text-align: left; font-size: 1rem; cursor: pointer; box-sizing: border-box; transition: background 0.2s, border-color 0.2s; line-height: 1.3; }
        
        .option-btn.correct { background-color: #2ecc71 !important; border-color: #27ae60 !important; color: white; }
        .option-btn.wrong { background-color: #e74c3c !important; border-color: #c0392b !important; color: white; }
        .option-btn:disabled { cursor: not-allowed; }

        .hidden { display: none; }
        .result { font-size: 1.3rem; text-align: center; font-weight: bold; color: #2c3e50; line-height: 1.5; }
        
        .control-btn { display: block; width: 100%; background: #3498db; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .control-btn:active { background: #2980b9; }
    </style>
</head>

    <div id="quiz-screen">

        <img id="quiz-img" class="quiz-image" src="" alt="Иллюстрация к вопросу">
        
        <div id="options-container"></div>
        
        <button id="next-btn" class="control-btn hidden" onclick="nextQuestion()">Дальше</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result" id="result-text"></div>
        <button class="control-btn" onclick="restartQuiz()">Пройти еще раз</button>
    </div>
</div>

        let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById('question-text');
    const quizImg = document.getElementById('quiz-img');
    const optionsContainer = document.getElementById('options-container');
    const progressText = document.getElementById('progress');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const resultText = document.getElementById('result-text');
    const nextBtn = document.getElementById('next-btn');

    function loadQuestion() {
        const currentData = quizData[currentQuestionIndex];
        
        progressText.innerText = `Вопрос ${currentQuestionIndex + 1} из ${quizData.length}`;
        questionText.innerText = currentData.question;
        
        if (currentData.image) {
            quizImg.src = currentData.image;
            quizImg.style.display = "block"; 
        } else {
            quizImg.style.display = "none";  
        }
        
        optionsContainer.innerHTML = '';
        nextBtn.classList.add('hidden'); 
        
        currentData.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.onclick = () => checkAnswer(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex, clickedButton) {
        const currentData = quizData[currentQuestionIndex];
        const allButtons = optionsContainer.getElementsByClassName('option-btn');
        
        for (let btn of allButtons) {
            btn.disabled = true;
        }
        
        if (selectedIndex === currentData.correct) {
            clickedButton.classList.add('correct');
            score++;
        } else {
            clickedButton.classList.add('wrong');
            allButtons[currentData.correct].classList.add('correct');
        }
        
        nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { 
            loadQuestion(); 
        } else { 
            showResults(); 
        }
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        resultText.innerText = `Вы правильно ответили на ${score} из ${quizData.length} вопросов!`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0; score = 0;
        resultScreen.classList.add('hidden'); quizScreen.classList.remove('hidden');
        loadQuestion();
    }

    loadQuestion();
</script>
