<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тесты: Огневая подготовка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 100%;
            box-sizing: border-box;
        }

        .question {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #333;
            line-height: 1.4;
        }

        .quiz-image {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            background: #fafafa;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s, border-color 0.2s;
            line-height: 1.3;
        }

        .option-btn.correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            color: white;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .result {
            font-size: 1.3rem;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.5;
        }

        .control-btn {
            display: block;
            width: 100%;
            background: #3498db;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .control-btn:active {
            background: #2980b9;
        }

        .select-style {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #3498db;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="quiz-container">

    <!-- Экран выбора билета -->
    <div id="start-screen">
        <h2 style="text-align:center; color:#2c3e50;">Огневая подготовка 2026 год</h2>
        <p style="text-align:center; color:#666;">Выберите вариант для тестирования:</p>

        <select id="variant-select" class="select-style">
            <option value="1">Вариант 1</option>
            <option value="2">Вариант 2</option>
            <option value="3">Вариант 3</option>
            <option value="4">Вариант 4</option>
            <option value="5">Вариант 5</option>
        </select>

        <button class="control-btn" onclick="startQuiz()">Начать тест</button>
    </div>

    <!-- Экран теста -->
    <div id="quiz-screen" class="hidden">
        <div id="progress" style="color:#888; margin-bottom:10px; font-size:0.95rem; font-weight:500;"></div>

        <div class="question" id="question-text">Загрузка вопросов...</div>

        <img
            id="quiz-img"
            class="quiz-image"
            src=""
            alt="Иллюстрация к вопросу"
            onerror="this.style.display='none';"
        >

        <div id="options-container"></div>

        <button id="next-btn" class="control-btn hidden" onclick="nextQuestion()">Дальше</button>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen" class="hidden">
        <div class="result" id="result-text"></div>
        <button class="control-btn" onclick="backToMenu()">Главное меню</button>
    </div>

</div>

    let currentQuiz = [];
    let currentQuestionIndex = 0;
    let score = 0;

    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const quizImg = document.getElementById('quiz-img');
    const optionsContainer = document.getElementById('options-container');
    const progressText = document.getElementById('progress');
    const resultText = document.getElementById('result-text');
    const nextBtn = document.getElementById('next-btn');

    function startQuiz() {
        const selectedVariant = document.getElementById('variant-select').value;

        currentQuiz = allVariants[selectedVariant];
        currentQuestionIndex = 0;
        score = 0;

        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');

        loadQuestion();
    }

    function loadQuestion() {
        const currentData = currentQuiz[currentQuestionIndex];

        progressText.innerText = `Вопрос ${currentQuestionIndex + 1} из ${currentQuiz.length}`;
        questionText.innerText = currentData.question;

        quizImg.onerror = function () {
            this.style.display = 'none';
        };

        if (currentData.image) {
            quizImg.src = currentData.image;
            quizImg.style.display = 'block';
        } else {
            quizImg.removeAttribute('src');
            quizImg.style.display = 'none';
        }

        optionsContainer.innerHTML = '';
        nextBtn.classList.add('hidden');

        currentData.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.onclick = () => checkAnswer(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex, clickedButton) {
        const currentData = currentQuiz[currentQuestionIndex];
        const allButtons = optionsContainer.getElementsByClassName('option-btn');

        for (const btn of allButtons) {
            btn.disabled = true;
        }

        if (selectedIndex === currentData.correct) {
            clickedButton.classList.add('correct');
            score++;
        } else {
            clickedButton.classList.add('wrong');
            allButtons[currentData.correct].classList.add('correct');
        }

        nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;

        if (currentQuestionIndex < currentQuiz.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        const minPass = 16;
        const status = score >= minPass
            ? "<span style='color:#2ecc71;'>ЗАЧЕТ</span>"
            : "<span style='color:#e74c3c;'>НЕЗАЧЕТ</span>";

        resultText.innerHTML =
            `Вы правильно ответили на ${score} из ${currentQuiz.length} вопросов!<br><br>Оценка: ${status}`;
    }

    function backToMenu() {
        resultScreen.classList.add('hidden');
        quizScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    }
